site_name: AI Agent 工程师课程
site_description: 从原理到生产实践，系统学习 AI Agent Engineering 的中文开源课程
site_author: TangHuaiZhe
site_url: https://tanghuaizhe.github.io/ai-agent-engineering-course/
repo_url: https://github.com/TangHuaiZhe/ai-agent-engineering-course
repo_name: TangHuaiZhe/ai-agent-engineering-course
edit_uri: edit/main/
docs_dir: .site-src
site_dir: .site-build
use_directory_urls: true

theme:
  name: material
  language: zh
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 首页: index.md
  - 学习路线:
      - 12 周计划: ROADMAP.md
      - 课程大纲: SYLLABUS.md
      - 先修知识: docs/prerequisites.md
      - 学习指南: docs/study-guide.md
  - 核心课程:
      - 01 软件工程: modules/01-software-engineering/README.md
      - 02 LLM 基础:
          - 模块导读: modules/02-llm-foundations/README.md
          - 02.1 模型与 Token: modules/02-llm-foundations/01-model-basics.md
          - 02.2 Prompt 与可靠性: modules/02-llm-foundations/02-prompt-and-reliability.md
          - 02.3 结构化输出: modules/02-llm-foundations/03-structured-outputs.md
          - 02.4 成本与评测: modules/02-llm-foundations/04-cost-latency-evals.md
      - 03 Agent 架构:
          - 本模块导读: modules/03-agent-architecture/README.md
          - 03.1 Agent 与 Workflow: modules/03-agent-architecture/01-agent-vs-workflow.md
          - 03.2 Agent Loop 与状态: modules/03-agent-architecture/02-agent-loop-and-state.md
          - 03.3 工具调用与恢复: modules/03-agent-architecture/03-tools-observation-recovery.md
          - 03.4 Planning 与多 Agent: modules/03-agent-architecture/04-planning-and-multi-agent.md
          - 03.5 安全边界与评测: modules/03-agent-architecture/05-safety-and-evaluation.md
      - 04 工具与 MCP:
          - 模块导读: modules/04-tools-mcp/README.md
          - 04.1 工具契约: modules/04-tools-mcp/01-tool-contracts.md
          - 04.2 MCP 协议: modules/04-tools-mcp/02-mcp-protocol.md
          - 04.3 安全与授权: modules/04-tools-mcp/03-auth-approval-security.md
          - 04.4 Python MCP SDK v2: modules/04-tools-mcp/04-sdk-v2-practice.md
      - 05 RAG 与记忆:
          - 模块导读: modules/05-rag-memory/README.md
          - 05.1 RAG 系统边界: modules/05-rag-memory/01-rag-system.md
          - 05.2 Chunking 与 Provenance: modules/05-rag-memory/02-chunking-provenance.md
          - 05.3 Hybrid Retrieval: modules/05-rag-memory/03-hybrid-retrieval.md
          - 05.4 Retrieval Evals: modules/05-rag-memory/04-retrieval-evals.md
          - 05.5 Memory 与 State: modules/05-rag-memory/05-memory-and-state.md
      - 06 工作流编排:
          - 模块导读: modules/06-orchestration/README.md
          - 06.1 工作流与状态机: modules/06-orchestration/01-workflow-state-machine.md
          - 06.2 路由、并行与评估修订: modules/06-orchestration/02-routing-parallel-evaluator.md
          - 06.3 检查点与失败恢复: modules/06-orchestration/03-checkpoint-resume.md
          - 06.4 人工审批与幂等: modules/06-orchestration/04-approval-idempotency.md
      - 07 上下文工程:
