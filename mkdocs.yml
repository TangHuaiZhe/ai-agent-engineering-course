          - 07.1 上下文分层与可信边界: modules/07-context-engineering/01-context-layers.md
          - 07.2 预算、裁剪与缓存: modules/07-context-engineering/02-budget-and-caching.md
          - 07.3 摘要、检索与事实生命周期: modules/07-context-engineering/03-summary-retrieval.md
          - 07.4 长任务评测: modules/07-context-engineering/04-long-task-evals.md
      - 08 评测与可观测性: modules/08-evaluation/README.md
      - 09 Agent 安全: modules/09-security/README.md
      - 10 生产部署: modules/10-production/README.md
  - 实践与项目:
      - 实验索引: labs/README.md
      - Lab 00 结构化输出: labs/lab-00-structured-output.md
      - Lab 01 有边界的 Agent: labs/lab-01-bounded-agent.md
      - Lab 02 MCP Server/Client: labs/lab-02-mcp-tools.md
      - Lab 03 RAG 与 Memory: labs/lab-03-rag-memory.md
      - Lab 04 可恢复工作流: labs/lab-04-resumable-workflow.md
      - Lab 05 上下文工程: labs/lab-05-context-engineering.md
      - 代码示例: examples/README.md
      - 研究 Agent 项目: projects/equity-research-agent/README.md
      - 系统架构: projects/equity-research-agent/ARCHITECTURE.md
      - 验收标准: projects/equity-research-agent/ACCEPTANCE.md
  - 参考与维护:
      - 官方资料: references/README.md
      - 贡献指南: CONTRIBUTING.md
      - 版本记录: CHANGELOG.md
      - GitHub Pages 部署: docs/deployment.md
