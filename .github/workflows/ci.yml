name: Course CI
on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile examples
        run: python -m compileall -q examples
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  mcp-protocol-tests:
    name: MCP SDK v2 integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SDK v2 for Lab 02
        run: python -m pip install -r requirements-mcp-lab.txt
      - name: Run real MCP Client/Server protocol tests
        run: python -m unittest tests.test_mcp_course_integration -v
